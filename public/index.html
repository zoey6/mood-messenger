<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodlink</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 50%, #f6d5f7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      line-height: 1.5;
      position: relative;
    }

    /* ===== 漂浮粒子背景 ===== */
    .particles {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      opacity: 0.18;
      animation: floatUp linear infinite;
      font-size: 20px;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.18; }
      90% { opacity: 0.18; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    /* ===== 登录卡片 ===== */
    .card {
      background: rgba(255,255,255,0.88);
      border-radius: 28px;
      padding: 48px 32px 40px;
      box-shadow: 0 20px 60px rgba(161,140,209,0.2);
      backdrop-filter: blur(20px);
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #7c5cbf, #e091c9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 36px;
      letter-spacing: -0.5px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #ede8f5;
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: rgba(255,255,255,0.7);
      color: #444;
    }

    .input-group input:focus {
      border-color: #b794d6;
      box-shadow: 0 0 0 4px rgba(183,148,214,0.15);
    }

    .input-group input::placeholder { color: #c4b8d9; }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(161,140,209,0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .room-hint {
      text-align: center;
      font-size: 12px;
      color: #b8a9cc;
      margin-top: 16px;
      line-height: 1.6;
    }

    /* ===== 屏幕切换 ===== */
    #login-screen, #main-screen { display: none; }
    #login-screen.active, #main-screen.active { display: block; }

    /* ===== 主界面顶部 ===== */
    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .header .logo-main {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header .logo-main .heart {
      display: inline-block;
      animation: heartbeat 1.2s ease infinite;
      font-size: 22px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    .header .status-bar {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-indicator {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-indicator.online { background: #69f0ae; box-shadow: 0 0 6px rgba(105,240,174,0.6); }
    .status-indicator.offline { background: #ff5252; }

    /* ===== 通用模块卡片 ===== */
    .module {
      background: rgba(255,255,255,0.80);
      border-radius: 20px;
      padding: 22px 24px;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(161,140,209,0.1);
      backdrop-filter: blur(12px);
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .module-title {
      font-size: 15px;
      font-weight: 700;
      color: #5A4B81;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== 用户列表 ===== */
    .user-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .user-chip {
      padding: 9px 20px;
      background: rgba(237,232,245,0.6);
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s;
      border: 2px solid transparent;
      font-weight: 600;
      color: #6b5b8a;
    }

    .user-chip:hover {
      background: rgba(220,210,240,0.7);
      transform: translateY(-1px);
    }

    .user-chip.selected {
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(161,140,209,0.3);
    }

    .no-users {
      text-align: center;
      padding: 16px 0;
      width: 100%;
    }

    .no-users .waiting-text {
      color: #b8a9cc;
      font-size: 13px;
      font-weight: 600;
    }

    .no-users .waiting-text .dots {
      display: inline-block;
      animation: dotPulse 1.5s infinite;
    }

    @keyframes dotPulse {
      0% { content: ''; }
      25% { opacity: 0.4; }
      50% { opacity: 1; }
      75% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .invite-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .invite-text {
      font-size: 12px;
      color: #c4b0db;
      font-weight: 600;
    }

    .btn-copy {
      padding: 6px 16px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-copy:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(161,140,209,0.3);
    }

    .btn-copy.copied {
      background: linear-gradient(135deg, #69f0ae, #00e676);
    }

    /* ===== 心情选择网格 ===== */
    .mood-inner {
      background: rgba(250,247,255,0.5);
      border-radius: 16px;
      padding: 14px;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .mood-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 6px;
      border: 2px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .mood-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(200,180,230,0.4);
    }

    .mood-btn:active { transform: scale(0.95); }

    .mood-btn .emoji {
      font-size: 36px;
      margin-bottom: 6px;
      transition: transform 0.3s;
    }

    .mood-btn:hover .emoji { transform: scale(1.15); }

    .mood-btn .label {
      font-size: 11px;
      font-weight: 700;
    }

    /* 马卡龙低饱和配色 */
    .mood-btn.happy { background: #FFF8E1; }
    .mood-btn.happy .label { color: #D4A017; }

    .mood-btn.unhappy { background: #E8F0FE; }
    .mood-btn.unhappy .label { color: #5B86C5; }

    .mood-btn.angry { background: #FDE8E8; }
    .mood-btn.angry .label { color: #D46A6A; }

    .mood-btn.speechless { background: #F3EAFA; }
    .mood-btn.speechless .label { color: #9B7FC4; }

    .mood-btn.sad { background: #E8EAF6; }
    .mood-btn.sad .label { color: #7986CB; }

    .mood-btn.numb { background: #ECEFF1; }
    .mood-btn.numb .label { color: #90A4AE; }

    .mood-btn.anxious { background: #FFF3E0; }
    .mood-btn.anxious .label { color: #D4915E; }

    /* 选中态 */
    .mood-btn.selected-mood {
      border-color: #e091c9;
      box-shadow: 0 0 0 3px rgba(224,145,201,0.2), 0 6px 20px rgba(0,0,0,0.06);
    }

    .mood-btn.selected-mood::before {
      content: '';
      position: absolute;
      top: 4px; right: 4px;
      width: 18px; height: 18px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      color: white;
    }

    /* 发送成功动画 */
    .mood-btn.sent::after {
      content: '✓';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      font-size: 32px;
      color: white;
      background: rgba(105,240,174,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      animation: sentFade 1s ease forwards;
    }

    @keyframes sentFade {
      0% { opacity: 1; transform: scale(1); }
      60% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.05); pointer-events: none; }
    }

    /* ===== 附加文字输入 ===== */
    .msg-input-area {
      margin-top: 14px;
      display: none;
      animation: slideUp 0.3s ease;
    }

    .msg-input-area.visible { display: block; }

    .msg-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .msg-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ede8f5;
      border-radius: 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
      background: rgba(255,255,255,0.7);
      color: #555;
    }

    .msg-input:focus { border-color: #b794d6; }
    .msg-input::placeholder { color: #c4b8d9; }

    .btn-send {
      padding: 12px 24px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(161,140,209,0.3);
    }

    .btn-send:active { transform: translateY(0); }

    /* ===== 历史记录 ===== */
    .history-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    /* 气泡消息 */
    .bubble {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: rgba(250,247,255,0.6);
      border-radius: 16px;
      margin-bottom: 10px;
      animation: bubbleIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      transition: background 0.2s;
    }

    .bubble:hover { background: rgba(245,240,255,0.8); }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bubble .b-emoji { font-size: 32px; flex-shrink: 0; }

    .bubble .b-content { flex: 1; min-width: 0; }

    .bubble .b-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .bubble .b-name {
      font-size: 13px;
      font-weight: 700;
      color: #5A4B81;
    }

    .bubble .b-mood {
      font-size: 12px;
      color: #b8a9cc;
      font-weight: 600;
    }

    .bubble .b-msg {
      font-size: 13px;
      color: #777;
      margin-top: 2px;
      word-break: break-all;
    }

    .bubble .b-time {
      font-size: 11px;
      color: #ccc;
      margin-top: 4px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 28px 0 16px;
    }

    .empty-state .empty-illustration {
      font-size: 56px;
      margin-bottom: 10px;
      opacity: 0.6;
    }

    .empty-state .empty-text {
      font-size: 13px;
      color: #c4b8d9;
      font-weight: 600;
    }

    /* ===== 通知弹窗 ===== */
    .notification-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(90,75,129,0.35);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
      padding: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .notification-card {
      background: white;
      border-radius: 28px;
      padding: 44px 32px 36px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 80px rgba(90,75,129,0.2);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .notification-card .notif-emoji {
      font-size: 72px;
      margin-bottom: 12px;
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .notification-card .notif-title {
      font-size: 18px;
      font-weight: 800;
      color: #5A4B81;
      margin-bottom: 6px;
    }

    .notification-card .notif-body {
      font-size: 15px;
      color: #777;
      margin-bottom: 6px;
      line-height: 1.6;
    }

    .notification-card .notif-msg {
      font-size: 14px;
      color: #a18cd1;
      font-weight: 600;
      margin-bottom: 8px;
      font-style: italic;
    }

    .notification-card .notif-time {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 22px;
    }

    .btn-dismiss {
      padding: 13px 44px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-dismiss:hover { transform: translateY(-2px); }

    /* ===== Toast ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(90,75,129,0.15);
      animation: slideIn 0.4s ease, slideOut 0.4s ease 4.6s forwards;
      min-width: 260px;
      backdrop-filter: blur(10px);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(80px); }
    }

    .toast .toast-emoji { font-size: 28px; }
    .toast .toast-text { font-size: 13px; color: #5A4B81; font-weight: 600; }

    /* ===== 响应式 ===== */
    @media (max-width: 400px) {
      .mood-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .mood-btn .emoji { font-size: 30px; }
      .card { padding: 32px 20px 28px; }
      .module { padding: 18px 18px; }
    }
  </style>
</head>
<body>
  <!-- 漂浮粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 登录界面 -->
  <div class="container">
    <div id="login-screen" class="active">
      <div class="card">
        <div class="logo">Moodlink</div>
        <div class="input-group">
          <label>你的昵称</label>
          <input type="text" id="username-input" placeholder="给自己取个名字吧" maxlength="20" autocomplete="off">
        </div>
        <div class="input-group">
          <label>房间号</label>
          <input type="text" id="room-input" placeholder="和对方约定一个暗号" maxlength="30" autocomplete="off">
        </div>
        <button class="btn-primary" id="login-btn">进入</button>
        <div class="room-hint">输入相同房间号的人才能互相看到<br>只属于你们两个人的空间</div>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-screen">
      <div class="header">
        <div class="logo-main">
          Moodlink <span class="heart">&#10084;</span>
        </div>
        <div class="status-bar">
          <span class="status-indicator online" id="status-dot"></span>
          <span id="status-text">已连接</span>
          <span style="opacity:0.5">·</span>
          <span id="display-name"></span>
        </div>
      </div>

      <div class="module" id="target-module">
        <div class="module-title">发送给谁</div>
        <div class="user-list" id="user-list">
          <div class="no-users">
            <div class="waiting-text">等待对方进入房间<span class="dots">...</span></div>
            <div class="invite-row">
              <span class="invite-text">邀请 ta 一起上线</span>
              <button class="btn-copy" id="copy-link-btn" onclick="copyLink()">复制链接</button>
            </div>
          </div>
        </div>
      </div>

      <div class="module" id="mood-module">
        <div class="module-title">你现在的心情</div>
        <div class="mood-inner">
          <div class="mood-grid" id="mood-grid">
            <button class="mood-btn happy" data-mood="开心" data-emoji="😄" onclick="selectMood(this)">
              <span class="emoji">😄</span>
              <span class="label">开心</span>
            </button>
            <button class="mood-btn unhappy" data-mood="不开心" data-emoji="😞" onclick="selectMood(this)">
              <span class="emoji">😞</span>
              <span class="label">不开心</span>
            </button>
            <button class="mood-btn angry" data-mood="生气" data-emoji="😡" onclick="selectMood(this)">
              <span class="emoji">😡</span>
              <span class="label">生气</span>
            </button>
            <button class="mood-btn speechless" data-mood="无语" data-emoji="😑" onclick="selectMood(this)">
              <span class="emoji">😑</span>
              <span class="label">无语</span>
            </button>
            <button class="mood-btn sad" data-mood="伤心emo" data-emoji="😢" onclick="selectMood(this)">
              <span class="emoji">😢</span>
              <span class="label">伤心emo</span>
            </button>
            <button class="mood-btn numb" data-mood="无感" data-emoji="😶" onclick="selectMood(this)">
              <span class="emoji">😶</span>
              <span class="label">无感</span>
            </button>
            <button class="mood-btn anxious" data-mood="焦虑" data-emoji="😰" onclick="selectMood(this)">
              <span class="emoji">😰</span>
              <span class="label">焦虑</span>
            </button>
          </div>
        </div>
        <div class="msg-input-area" id="msg-input-area">
          <div class="msg-input-row">
            <input class="msg-input" id="msg-input" type="text" placeholder="想对 ta 说点什么？（可选）" maxlength="100">
            <button class="btn-send" onclick="sendMood()">发送</button>
          </div>
        </div>
      </div>

      <div class="module" id="history-module">
        <div class="module-title">收到的心情</div>
        <div class="history-list" id="history-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-illustration">🧸</div>
            <div class="empty-text">安静地等待一份心情到来...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 通知音效 -->
  <audio id="notif-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgipGLfWxucICRkYV0ZGVxf4mMiH91cHR8hYmHgXl1d3yBhYSBfXt7fYCCgoB+fX1+gIGBgH9+fn+AgYGAf39/f4CAgIB/f3+AgICAgH9/gICAgICAf4CAgICAgICAgICAgICAgA==" type="audio/wav">
  </audio>

  <script>
    let ws = null;
    let currentUser = '';
    let currentRoom = '';
    let selectedTarget = '';
    let selectedMoodBtn = null;
    let reconnectTimer = null;

    // DOM
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const loginBtn = document.getElementById('login-btn');
    const displayName = document.getElementById('display-name');
    const userList = document.getElementById('user-list');
    const historyList = document.getElementById('history-list');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const toastContainer = document.getElementById('toast-container');
    const msgInputArea = document.getElementById('msg-input-area');
    const msgInput = document.getElementById('msg-input');

    // ===== 漂浮粒子 =====
    function createParticles() {
      const container = document.getElementById('particles');
      const symbols = ['♥', '✦', '♡', '·', '✧', '♥', '✦'];
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.fontSize = (12 + Math.random() * 16) + 'px';
        p.style.animationDuration = (12 + Math.random() * 18) + 's';
        p.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(p);
      }
    }
    createParticles();

    // ===== 登录 =====
    loginBtn.addEventListener('click', login);
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') roomInput.focus(); });
    roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

    function login() {
      const name = usernameInput.value.trim();
      const room = roomInput.value.trim();
      if (!name) { usernameInput.style.borderColor = '#e091c9'; usernameInput.focus(); return; }
      if (!room) { roomInput.style.borderColor = '#e091c9'; roomInput.focus(); return; }

      currentUser = name;
      currentRoom = room;
      displayName.textContent = name;
      loginScreen.classList.remove('active');
      mainScreen.classList.add('active');

      requestNotificationPermission();
      connectWebSocket();
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // ===== WebSocket =====
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        statusDot.className = 'status-indicator online';
        statusText.textContent = '已连接';
        ws.send(JSON.stringify({ type: 'register', username: currentUser, room: currentRoom }));
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'user_list') renderUserList(msg.users);
        if (msg.type === 'mood_notification') handleMoodNotification(msg);
      };

      ws.onclose = () => {
        statusDot.className = 'status-indicator offline';
        statusText.textContent = '重连中';
        reconnectTimer = setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => { ws.close(); };
    }

    // ===== 用户列表 =====
    function renderUserList(users) {
      const others = users.filter(u => u !== currentUser);
      if (others.length === 0) {
        userList.innerHTML = `
          <div class="no-users">
            <div class="waiting-text">等待对方进入房间<span class="dots">...</span></div>
            <div class="invite-row">
              <span class="invite-text">邀请 ta 一起上线</span>
              <button class="btn-copy" onclick="copyLink()">复制链接</button>
            </div>
          </div>`;
        selectedTarget = '';
        return;
      }

      userList.innerHTML = others.map(u => {
        const sel = u === selectedTarget ? 'selected' : '';
        return `<div class="user-chip ${sel}" onclick="selectTarget('${u}')">${u}</div>`;
      }).join('');

      if (!others.includes(selectedTarget)) {
        selectedTarget = others.length === 1 ? others[0] : '';
        if (others.length === 1) renderUserList(users);
      }
    }

    function selectTarget(username) {
      selectedTarget = username;
      document.querySelectorAll('.user-chip').forEach(c => {
        c.classList.toggle('selected', c.textContent === username);
      });
    }

    // ===== 复制链接 =====
    function copyLink() {
      navigator.clipboard.writeText(location.href).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制链接'; btn.classList.remove('copied'); }, 2000);
      }).catch(() => {
        showToast('⚠️', '复制失败，请手动复制地址栏链接');
      });
    }

    // ===== 选择心情 =====
    function selectMood(btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected-mood'));
      btn.classList.add('selected-mood');
      selectedMoodBtn = btn;
      msgInputArea.classList.add('visible');
      msgInput.focus();
    }

    // ===== 发送心情 =====
    function sendMood() {
      if (!selectedTarget) { showToast('⚠️', '请先选择发送对象'); return; }
      if (!selectedMoodBtn) { showToast('⚠️', '请先选择一个心情'); return; }

      const mood = selectedMoodBtn.dataset.mood;
      const emoji = selectedMoodBtn.dataset.emoji;
      const message = msgInput.value.trim();

      ws.send(JSON.stringify({
        type: 'mood',
        from: currentUser,
        to: selectedTarget,
        mood, emoji, message
      }));

      selectedMoodBtn.classList.add('sent');
      const btn = selectedMoodBtn;
      setTimeout(() => {
        btn.classList.remove('sent');
        btn.classList.remove('selected-mood');
      }, 1000);

      selectedMoodBtn = null;
      msgInput.value = '';
      msgInputArea.classList.remove('visible');

      showToast(emoji, `已发送「${mood}」给 ${selectedTarget}`);
    }

    // Enter 键发送
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMood(); });

    // ===== 收到心情通知 =====
    function handleMoodNotification(msg) {
      const { from, mood, emoji, message, timestamp } = msg;
      showNotificationOverlay(from, mood, emoji, message, timestamp);
      showToast(emoji, `${from}「${mood}」`);
      sendBrowserNotification(from, mood, emoji, message);
      playNotifSound();
      addToHistory(from, mood, emoji, message, timestamp);
    }

    function showNotificationOverlay(from, mood, emoji, message, timestamp) {
      const time = new Date(timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const overlay = document.createElement('div');
      overlay.className = 'notification-overlay';
      const msgHtml = message ? `<div class="notif-msg">"${message}"</div>` : '';
      overlay.innerHTML = `
        <div class="notification-card">
          <div class="notif-emoji">${emoji}</div>
          <div class="notif-title">收到一份心情</div>
          <div class="notif-body"><strong>${from}</strong> 现在是 <strong>${mood}</strong> 的状态</div>
          ${msgHtml}
          <div class="notif-time">${time}</div>
          <button class="btn-dismiss" onclick="this.closest('.notification-overlay').remove()">知道了</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function sendBrowserNotification(from, mood, emoji, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        let body = `${from} 现在是「${mood}」的状态`;
        if (message) body += `\n"${message}"`;
        const notif = new Notification(`${emoji} Moodlink`, {
          body,
          icon: `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${emoji}</text></svg>`,
          tag: 'mood-' + Date.now(),
          requireInteraction: true
        });
        notif.onclick = () => { window.focus(); notif.close(); };
      }
    }

    function showToast(emoji, text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span class="toast-emoji">${emoji}</span><span class="toast-text">${text}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function playNotifSound() {
      try {
        const s = document.getElementById('notif-sound');
        s.currentTime = 0;
        s.play().catch(() => {});
      } catch(e) {}
    }

    function addToHistory(from, mood, emoji, message, timestamp) {
      const time = new Date(timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const msgHtml = message ? `<div class="b-msg">"${message}"</div>` : '';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `
        <span class="b-emoji">${emoji}</span>
        <div class="b-content">
          <div class="b-header">
            <span class="b-name">${from}</span>
            <span class="b-mood">${mood}</span>
          </div>
          ${msgHtml}
          <div class="b-time">${time}</div>
        </div>`;
      historyList.insertBefore(bubble, historyList.firstChild);
    }
  </script>
</body>
</html>
