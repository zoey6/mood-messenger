<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodlink</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 50%, #f6d5f7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow-x: hidden;
      line-height: 1.5;
      position: relative;
    }

    .particles {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      opacity: 0.13;
      animation: floatUp linear infinite;
      font-size: 20px;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.13; }
      90% { opacity: 0.13; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      padding-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.88);
      border-radius: 12px;
      padding: 48px 32px 40px;
      box-shadow: 0 12px 40px rgba(161,140,209,0.12);
      backdrop-filter: blur(20px);
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #7c5cbf, #e091c9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 36px;
      letter-spacing: -0.5px;
    }

    .input-group { margin-bottom: 18px; }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #ede8f5;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: rgba(255,255,255,0.7);
      color: #444;
    }

    .input-group input:focus {
      border-color: #b794d6;
      box-shadow: 0 0 0 4px rgba(183,148,214,0.15);
    }

    .input-group input::placeholder { color: #c4b8d9; }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(161,140,209,0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .room-hint {
      text-align: center;
      font-size: 12px;
      color: #b8a9cc;
      margin-top: 16px;
      line-height: 1.6;
    }

    #login-screen, #main-screen { display: none; }
    #login-screen.active, #main-screen.active { display: block; }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .header .logo-main {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header .logo-main .heart {
      display: inline-block;
      animation: heartbeat 1.2s ease infinite;
      font-size: 22px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    .header .status-bar {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-indicator {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-indicator.online { background: #69f0ae; box-shadow: 0 0 6px rgba(105,240,174,0.6); }
    .status-indicator.offline { background: #ff5252; }

    /* 上下线提醒 */
    .online-toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 700;
      color: #5A4B81;
      box-shadow: 0 6px 24px rgba(90,75,129,0.15);
      z-index: 998;
      animation: onlineIn 0.4s ease, onlineOut 0.4s ease 2.6s forwards;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    @keyframes onlineIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes onlineOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    .module {
      background: rgba(255,255,255,0.80);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(161,140,209,0.08);
      backdrop-filter: blur(12px);
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .module-title {
      font-size: 15px;
      font-weight: 700;
      color: #E07A97;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-list { display: flex; flex-wrap: wrap; gap: 10px; }

    .user-chip {
      padding: 9px 20px;
      background: rgba(237,232,245,0.6);
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s;
      border: 2px solid transparent;
      font-weight: 600;
      color: #6b5b8a;
    }

    .user-chip:hover {
      background: rgba(220,210,240,0.7);
      transform: translateY(-1px);
    }

    .user-chip.selected {
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(161,140,209,0.3);
    }

    .no-users { text-align: center; padding: 16px 0; width: 100%; }

    .no-users .waiting-text {
      color: #b8a9cc;
      font-size: 13px;
      font-weight: 600;
    }

    .no-users .waiting-text .dots {
      display: inline-block;
      animation: dotPulse 1.5s infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .invite-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .invite-text { font-size: 12px; color: #c4b0db; font-weight: 600; }

    .btn-copy {
      padding: 6px 16px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-copy:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(161,140,209,0.3);
    }

    .btn-copy.copied { background: linear-gradient(135deg, #69f0ae, #00e676); }

    .mood-inner {
      background: rgba(250,247,255,0.5);
      border-radius: 12px;
      padding: 14px;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .mood-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 6px;
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    .mood-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(200,180,230,0.4);
    }

    .mood-btn:active { transform: scale(0.88); transition: transform 0.1s; }

    .mood-btn .emoji {
      font-size: 36px;
      margin-bottom: 6px;
      transition: transform 0.3s;
    }

    .mood-btn:hover .emoji { transform: scale(1.15); }

    .mood-btn .label { font-size: 11px; font-weight: 700; }

    .mood-btn.happy { background: #FFF8E1; }
    .mood-btn.happy .label { color: #D4A017; }
    .mood-btn.unhappy { background: #E8F0FE; }
    .mood-btn.unhappy .label { color: #5B86C5; }
    .mood-btn.angry { background: #FDE8E8; }
    .mood-btn.angry .label { color: #D46A6A; }
    .mood-btn.speechless { background: #F3EAFA; }
    .mood-btn.speechless .label { color: #9B7FC4; }
    .mood-btn.sad { background: #E8EAF6; }
    .mood-btn.sad .label { color: #7986CB; }
    .mood-btn.numb { background: #ECEFF1; }
    .mood-btn.numb .label { color: #90A4AE; }
    .mood-btn.confused { background: #E3EEF5; }
    .mood-btn.confused .label { color: #6E99B4; }
    .mood-btn.anxious { background: #FFF3E0; }
    .mood-btn.anxious .label { color: #D4915E; }

    .mood-btn.selected-mood {
      border-color: #e091c9;
      box-shadow: 0 0 0 3px rgba(224,145,201,0.2), 0 6px 20px rgba(0,0,0,0.06);
      animation: moodBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes moodBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .mood-btn.selected-mood::before {
      content: '\2713';
      position: absolute;
      top: 3px; right: 3px;
      width: 18px; height: 18px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      color: white;
      line-height: 18px;
    }

    .mood-btn.sent::after {
      content: '\2713';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      font-size: 32px;
      color: white;
      background: rgba(105,240,174,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      animation: sentFade 1s ease forwards;
    }

    @keyframes sentFade {
      0% { opacity: 1; transform: scale(1); }
      60% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.05); pointer-events: none; }
    }

    .msg-input-area {
      margin-top: 14px;
      display: none;
      animation: slideUp 0.3s ease;
    }

    .msg-input-area.visible { display: block; }

    .msg-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .msg-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ede8f5;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
      background: rgba(255,255,255,0.7);
      color: #555;
    }

    .msg-input:focus { border-color: #b794d6; }
    .msg-input::placeholder { color: #c4b8d9; }

    .btn-photo {
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 2px solid #ede8f5;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .btn-photo:hover { border-color: #b794d6; background: rgba(237,232,245,0.5); }

    .btn-photo input[type="file"] {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .btn-photo.has-photo { border-color: #69f0ae; background: rgba(105,240,174,0.1); }

    .photo-preview-strip { margin-top: 10px; display: none; }
    .photo-preview-strip.visible { display: flex; gap: 8px; align-items: center; }

    .photo-preview-strip img {
      width: 60px; height: 60px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #ede8f5;
    }

    .photo-preview-strip .remove-photo {
      background: none; border: none;
      font-size: 18px; cursor: pointer;
      color: #ccc; padding: 4px;
      transition: color 0.2s;
    }

    .photo-preview-strip .remove-photo:hover { color: #e091c9; }

    .btn-send {
      padding: 12px 24px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(161,140,209,0.3);
    }

    .btn-send:active { transform: translateY(0); }

    .history-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    /* 收到的消息（左对齐） */
    .bubble {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: white;
      border-radius: 4px 12px 12px 12px;
      margin-bottom: 10px;
      animation: bubbleIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(161,140,209,0.06);
      position: relative;
    }

    .bubble:hover { background: #fdfbff; }

    /* 自己发送的（右对齐） */
    .bubble.sent-bubble {
      flex-direction: row-reverse;
      background: linear-gradient(135deg, #fce4f3 0%, #f0e0fa 100%);
      border-radius: 12px 4px 12px 12px;
    }

    .bubble.sent-bubble .b-content { align-items: flex-end; }
    .bubble.sent-bubble .b-header { flex-direction: row-reverse; }
    .bubble.sent-bubble .b-footer { flex-direction: row-reverse; }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bubble .b-emoji { font-size: 32px; flex-shrink: 0; }

    .bubble .b-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .bubble .b-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .bubble .b-name { font-size: 13px; font-weight: 700; color: #5A4B81; }
    .bubble .b-mood { font-size: 12px; color: #b8a9cc; font-weight: 600; }

    .bubble .b-msg {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
      word-break: break-all;
    }

    .bubble .b-photo {
      margin-top: 6px;
      max-width: 180px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .bubble .b-photo:hover { transform: scale(1.02); }

    .bubble .b-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .bubble .b-time { font-size: 11px; color: #ccc; }

    .bubble .b-read-status {
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.3s;
    }

    .bubble .b-read-status.unread { color: #ccc; }
    .bubble .b-read-status.read { color: #69f0ae; }

    .b-read-status.read .check-icon { animation: checkFill 0.4s ease; }

    @keyframes checkFill {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .bubble .b-recall {
      font-size: 11px; color: #ccc; cursor: pointer;
      border: none; background: none;
      font-family: inherit; padding: 0;
      transition: color 0.2s;
    }

    .bubble .b-recall:hover { color: #e091c9; }

    .bubble.recalled {
      opacity: 0.5;
      pointer-events: none;
    }

    .empty-state { text-align: center; padding: 28px 0 16px; }

    .empty-state .empty-illustration {
      font-size: 56px;
      margin-bottom: 10px;
      opacity: 0.6;
    }

    .empty-state .empty-text {
      font-size: 13px;
      color: #c4b8d9;
      font-weight: 600;
      line-height: 1.8;
    }

    /* 照片放大 */
    .photo-lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeIn 0.3s ease;
      cursor: pointer;
      padding: 20px;
    }

    .photo-lightbox img {
      max-width: 90%; max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease;
    }

    /* 通知弹窗 */
    .notification-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(90,75,129,0.35);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
      padding: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .notification-card {
      background: white;
      border-radius: 12px;
      padding: 44px 32px 36px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 80px rgba(90,75,129,0.2);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .notification-card .notif-emoji {
      font-size: 72px;
      margin-bottom: 12px;
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .notification-card .notif-title { font-size: 18px; font-weight: 800; color: #5A4B81; margin-bottom: 6px; }
    .notification-card .notif-body { font-size: 15px; color: #888; margin-bottom: 6px; line-height: 1.6; }
    .notification-card .notif-msg { font-size: 14px; color: #a18cd1; font-weight: 600; margin-bottom: 8px; font-style: italic; }

    .notification-card .notif-photo {
      max-width: 200px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .notification-card .notif-time { font-size: 11px; color: #ccc; margin-bottom: 22px; }

    .btn-dismiss {
      padding: 13px 44px;
      background: linear-gradient(135deg, #a18cd1, #e091c9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-dismiss:hover { transform: translateY(-2px); }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(90,75,129,0.15);
      animation: slideIn 0.4s ease, slideOut 0.4s ease 4.6s forwards;
      min-width: 260px;
      backdrop-filter: blur(10px);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(80px); }
    }

    .toast .toast-emoji { font-size: 28px; }
    .toast .toast-text { font-size: 13px; color: #5A4B81; font-weight: 600; }

    /* 微信绑定模块 */
    .wx-module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .wx-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
      font-weight: 600;
    }

    .wx-info .wx-icon { font-size: 20px; }

    .wx-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .wx-status-dot.bound { background: #69f0ae; box-shadow: 0 0 4px rgba(105,240,174,0.5); }
    .wx-status-dot.unbound { background: #ffab40; }

    .btn-wx {
      padding: 8px 18px;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-wx.bind {
      background: linear-gradient(135deg, #07c160, #06ad56);
      color: white;
    }

    .btn-wx.unbind {
      background: rgba(237,232,245,0.6);
      color: #999;
    }

    .btn-wx:hover { transform: translateY(-1px); }

    /* 二维码弹窗 */
    .qr-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(90,75,129,0.35);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
      padding: 20px;
    }

    .qr-card {
      background: white;
      border-radius: 12px;
      padding: 36px 32px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 80px rgba(90,75,129,0.2);
    }

    .qr-card .qr-title {
      font-size: 16px;
      font-weight: 800;
      color: #5A4B81;
      margin-bottom: 6px;
    }

    .qr-card .qr-desc {
      font-size: 12px;
      color: #999;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .qr-card img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .qr-card .qr-loading {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      background: #f5f3fa;
      border-radius: 8px;
      color: #b8a9cc;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 400px) {
      .mood-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .mood-btn .emoji { font-size: 28px; }
      .mood-btn { padding: 10px 4px; }
      .card { padding: 32px 20px 28px; }
      .module { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div id="login-screen" class="active">
      <div class="card">
        <div class="logo">Moodlink</div>
        <div class="input-group">
          <label>你的昵称</label>
          <input type="text" id="username-input" placeholder="给自己取个名字吧" maxlength="20" autocomplete="off">
        </div>
        <div class="input-group">
          <label>房间号</label>
          <input type="text" id="room-input" placeholder="和对方约定一个暗号" maxlength="30" autocomplete="off">
        </div>
        <button class="btn-primary" id="login-btn">进入</button>
        <div class="room-hint">输入相同房间号的人才能互相看到<br>只属于你们两个人的空间</div>
      </div>
    </div>

    <div id="main-screen">
      <div class="header">
        <div class="logo-main">
          Moodlink <span class="heart">&#10084;</span>
        </div>
        <div class="status-bar">
          <span class="status-indicator online" id="status-dot"></span>
          <span id="status-text">已连接</span>
          <span style="opacity:0.5">·</span>
          <span id="display-name"></span>
        </div>
      </div>

      <div class="module" id="target-module">
        <div class="module-title">发送给谁</div>
        <div class="user-list" id="user-list">
          <div class="no-users">
            <div class="waiting-text">等待对方进入房间<span class="dots">...</span></div>
            <div class="invite-row">
              <span class="invite-text">邀请 ta 一起上线</span>
              <button class="btn-copy" onclick="copyLink()">复制链接</button>
            </div>
          </div>
        </div>
      </div>

      <div class="module" id="mood-module">
        <div class="module-title">你现在的心情</div>
        <div class="mood-inner">
          <div class="mood-grid" id="mood-grid">
            <button class="mood-btn happy" data-mood="开心" data-emoji="😄" onclick="selectMood(this)">
              <span class="emoji">😄</span><span class="label">开心</span>
            </button>
            <button class="mood-btn unhappy" data-mood="不开心" data-emoji="😞" onclick="selectMood(this)">
              <span class="emoji">😞</span><span class="label">不开心</span>
            </button>
            <button class="mood-btn angry" data-mood="生气" data-emoji="😡" onclick="selectMood(this)">
              <span class="emoji">😡</span><span class="label">生气</span>
            </button>
            <button class="mood-btn speechless" data-mood="无语" data-emoji="😑" onclick="selectMood(this)">
              <span class="emoji">😑</span><span class="label">无语</span>
            </button>
            <button class="mood-btn sad" data-mood="伤心emo" data-emoji="😢" onclick="selectMood(this)">
              <span class="emoji">😢</span><span class="label">伤心emo</span>
            </button>
            <button class="mood-btn numb" data-mood="无感" data-emoji="😶" onclick="selectMood(this)">
              <span class="emoji">😶</span><span class="label">无感</span>
            </button>
            <button class="mood-btn confused" data-mood="疑惑" data-emoji="🤔" onclick="selectMood(this)">
              <span class="emoji">🤔</span><span class="label">疑惑</span>
            </button>
            <button class="mood-btn anxious" data-mood="焦虑" data-emoji="😰" onclick="selectMood(this)">
              <span class="emoji">😰</span><span class="label">焦虑</span>
            </button>
          </div>
        </div>
        <div class="msg-input-area" id="msg-input-area">
          <div class="msg-input-row">
            <input class="msg-input" id="msg-input" type="text" placeholder="想对 ta 说点什么？（可选）" maxlength="100">
            <div class="btn-photo" id="btn-photo" title="添加照片">
              📷
              <input type="file" id="photo-input" accept="image/*">
            </div>
            <button class="btn-send" onclick="sendMood()">发送</button>
          </div>
          <div class="photo-preview-strip" id="photo-preview-strip">
            <img id="photo-preview-img" src="" alt="preview">
            <button class="remove-photo" onclick="removePhoto()">✕</button>
          </div>
        </div>
      </div>

      <div class="module" id="wx-module">
        <div class="module-title">微信通知</div>
        <div class="wx-module">
          <div class="wx-info">
            <span class="wx-icon">💬</span>
            <span class="wx-status-dot unbound" id="wx-status-dot"></span>
            <span id="wx-status-text">未绑定</span>
          </div>
          <button class="btn-wx bind" id="wx-bind-btn" onclick="handleWxBind()">绑定微信</button>
        </div>
      </div>

      <div class="module" id="history-module">
        <div class="module-title">心情互动</div>
        <div class="history-list" id="history-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-illustration">🧸</div>
            <div class="empty-text">还没有心情互动～<br>先选个表情打个招呼吧 😊</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <audio id="notif-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgipGLfWxucICRkYV0ZGVxf4mMiH91cHR8hYmHgXl1d3yBhYSBfXt7fYCCgoB+fX1+gIGBgH9+fn+AgYGAf39/f4CAgIB/f3+AgICAgH9/gICAgICAf4CAgICAgICAgICAgICAgA==" type="audio/wav">
  </audio>

  <script>
    let ws = null;
    let currentUser = '';
    let currentRoom = '';
    let selectedTarget = '';
    let selectedMoodBtn = null;
    let reconnectTimer = null;
    let pendingPhoto = null;

    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const loginBtn = document.getElementById('login-btn');
    const displayName = document.getElementById('display-name');
    const userList = document.getElementById('user-list');
    const historyList = document.getElementById('history-list');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const toastContainer = document.getElementById('toast-container');
    const msgInputArea = document.getElementById('msg-input-area');
    const msgInput = document.getElementById('msg-input');
    const photoInput = document.getElementById('photo-input');
    const photoPreviewStrip = document.getElementById('photo-preview-strip');
    const photoPreviewImg = document.getElementById('photo-preview-img');
    const btnPhoto = document.getElementById('btn-photo');

    // 漂浮粒子（速度降低30%）
    function createParticles() {
      const container = document.getElementById('particles');
      const symbols = ['♥', '✦', '♡', '·', '✧', '♥', '✦'];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.fontSize = (12 + Math.random() * 16) + 'px';
        p.style.animationDuration = (18 + Math.random() * 22) + 's';
        p.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(p);
      }
    }
    createParticles();

    // 登录
    loginBtn.addEventListener('click', login);
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') roomInput.focus(); });
    roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

    function login() {
      const name = usernameInput.value.trim();
      const room = roomInput.value.trim();
      if (!name) { usernameInput.style.borderColor = '#e091c9'; usernameInput.focus(); return; }
      if (!room) { roomInput.style.borderColor = '#e091c9'; roomInput.focus(); return; }
      currentUser = name;
      currentRoom = room;
      displayName.textContent = name;
      loginScreen.classList.remove('active');
      mainScreen.classList.add('active');
      requestNotificationPermission();
      connectWebSocket();
      checkWxBindStatus();
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // WebSocket
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        statusDot.className = 'status-indicator online';
        statusText.textContent = '已连接';
        ws.send(JSON.stringify({ type: 'register', username: currentUser, room: currentRoom }));
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'user_list') renderUserList(msg.users);
        if (msg.type === 'mood_notification') handleMoodNotification(msg);
        if (msg.type === 'mood_sent_confirm') handleSentConfirm(msg);
        if (msg.type === 'read_receipt') handleReadReceipt(msg);
        if (msg.type === 'user_online') showOnlineToast(msg.username, true);
        if (msg.type === 'user_offline') showOnlineToast(msg.username, false);
        if (msg.type === 'msg_recalled') handleRecall(msg);
        if (msg.type === 'wx_bindstatus') updateWxBindUI(msg.bound);
      };

      ws.onclose = () => {
        statusDot.className = 'status-indicator offline';
        statusText.textContent = '重连中';
        reconnectTimer = setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => { ws.close(); };
    }

    // 上下线提醒
    function showOnlineToast(username, isOnline) {
      const el = document.createElement('div');
      el.className = 'online-toast';
      el.textContent = isOnline ? `${username} 已上线 ✨` : `${username} 已离线 💤`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // 用户列表
    function renderUserList(users) {
      const others = users.filter(u => u !== currentUser);
      if (others.length === 0) {
        userList.innerHTML = `
          <div class="no-users">
            <div class="waiting-text">等待对方进入房间<span class="dots">...</span></div>
            <div class="invite-row">
              <span class="invite-text">邀请 ta 一起上线</span>
              <button class="btn-copy" onclick="copyLink()">复制链接</button>
            </div>
          </div>`;
        selectedTarget = '';
        return;
      }
      userList.innerHTML = others.map(u => {
        const sel = u === selectedTarget ? 'selected' : '';
        return `<div class="user-chip ${sel}" onclick="selectTarget('${u}')">${u}</div>`;
      }).join('');
      if (!others.includes(selectedTarget)) {
        selectedTarget = others.length === 1 ? others[0] : '';
        if (others.length === 1) renderUserList(users);
      }
    }

    function selectTarget(username) {
      selectedTarget = username;
      document.querySelectorAll('.user-chip').forEach(c => {
        c.classList.toggle('selected', c.textContent === username);
      });
    }

    // 复制链接
    function copyLink() {
      navigator.clipboard.writeText(location.href).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制链接'; btn.classList.remove('copied'); }, 2000);
      }).catch(() => {
        showToast('⚠️', '复制失败，请手动复制地址栏链接');
      });
    }

    // 照片处理
    photoInput.addEventListener('change', handlePhotoSelect);

    function handlePhotoSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxSize = 600;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
          else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let quality = 0.8;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length > 200 * 1024 && quality > 0.1) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          pendingPhoto = dataUrl;
          photoPreviewImg.src = dataUrl;
          photoPreviewStrip.classList.add('visible');
          btnPhoto.classList.add('has-photo');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      pendingPhoto = null;
      photoInput.value = '';
      photoPreviewStrip.classList.remove('visible');
      btnPhoto.classList.remove('has-photo');
    }

    // 选择心情
    function selectMood(btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected-mood'));
      btn.classList.add('selected-mood');
      selectedMoodBtn = btn;
      msgInputArea.classList.add('visible');
      msgInput.focus();
    }

    // 发送心情
    function sendMood() {
      if (!selectedTarget) { showToast('⚠️', '请先选择发送对象'); return; }
      if (!selectedMoodBtn) { showToast('⚠️', '请先选择一个心情'); return; }
      const mood = selectedMoodBtn.dataset.mood;
      const emoji = selectedMoodBtn.dataset.emoji;
      const message = msgInput.value.trim();
      ws.send(JSON.stringify({
        type: 'mood', from: currentUser, to: selectedTarget,
        mood, emoji, message, photo: pendingPhoto || ''
      }));
      selectedMoodBtn.classList.add('sent');
      const btn = selectedMoodBtn;
      setTimeout(() => { btn.classList.remove('sent'); btn.classList.remove('selected-mood'); }, 1000);
      selectedMoodBtn = null;
      msgInput.value = '';
      removePhoto();
      msgInputArea.classList.remove('visible');
      showToast(emoji, `已发送「${mood}」给 ${selectedTarget}`);
    }

    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMood(); });

    // 自己发送确认
    function handleSentConfirm(msg) {
      const { msgId, to, mood, emoji, message, photo, timestamp } = msg;
      addToHistory('我', mood, emoji, message, timestamp, true, msgId, photo, to);
    }

    // 收到心情
    function handleMoodNotification(msg) {
      const { msgId, from, mood, emoji, message, photo, timestamp } = msg;
      ws.send(JSON.stringify({ type: 'mark_read', msgId, reader: currentUser }));
      showNotificationOverlay(from, mood, emoji, message, photo, timestamp);
      showToast(emoji, `${from}「${mood}」`);
      sendBrowserNotification(from, mood, emoji, message);
      playNotifSound();
      addToHistory(from, mood, emoji, message, timestamp, false, msgId, photo, '');
    }

    // 已读回执
    function handleReadReceipt(msg) {
      const el = document.querySelector(`[data-msg-id="${msg.msgId}"] .b-read-status`);
      if (el) {
        el.className = 'b-read-status read';
        el.innerHTML = '<span class="check-icon">✓✓</span> 已读';
      }
    }

    // 撤回
    function handleRecall(msg) {
      const el = document.querySelector(`[data-msg-id="${msg.msgId}"]`);
      if (el) {
        el.classList.add('recalled');
        el.querySelector('.b-emoji').textContent = '';
        el.querySelector('.b-content').innerHTML = '<span style="font-size:12px;color:#ccc;font-style:italic">该消息已撤回</span>';
        showToast('↩️', `${msg.by} 撤回了一条消息`);
      }
    }

    function recallMessage(msgId) {
      ws.send(JSON.stringify({ type: 'recall', msgId }));
    }

    // 照片放大
    function showPhotoLightbox(src) {
      const lb = document.createElement('div');
      lb.className = 'photo-lightbox';
      lb.innerHTML = '<img src="' + src + '">';
      lb.addEventListener('click', () => lb.remove());
      document.body.appendChild(lb);
    }

    function showNotificationOverlay(from, mood, emoji, message, photo, timestamp) {
      const time = new Date(timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const overlay = document.createElement('div');
      overlay.className = 'notification-overlay';
      const msgHtml = message ? '<div class="notif-msg">"' + message + '"</div>' : '';
      const photoHtml = photo ? '<img class="notif-photo" src="' + photo + '" onclick="event.stopPropagation(); showPhotoLightbox(this.src)">' : '';
      overlay.innerHTML =
        '<div class="notification-card">' +
          '<div class="notif-emoji">' + emoji + '</div>' +
          '<div class="notif-title">收到一份心情</div>' +
          '<div class="notif-body"><strong>' + from + '</strong> 现在是 <strong>' + mood + '</strong> 的状态</div>' +
          msgHtml + photoHtml +
          '<div class="notif-time">' + time + '</div>' +
          '<button class="btn-dismiss" onclick="this.closest(\'.notification-overlay\').remove()">知道了</button>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function sendBrowserNotification(from, mood, emoji, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        let body = from + ' 现在是「' + mood + '」的状态';
        if (message) body += '\n"' + message + '"';
        const notif = new Notification(emoji + ' Moodlink', {
          body,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + emoji + '</text></svg>',
          tag: 'mood-' + Date.now(),
          requireInteraction: true
        });
        notif.onclick = () => { window.focus(); notif.close(); };
      }
    }

    function showToast(emoji, text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<span class="toast-emoji">' + emoji + '</span><span class="toast-text">' + text + '</span>';
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    // ===== 微信绑定 =====
    let wxBound = false;

    function checkWxBindStatus() {
      fetch('/api/wx/status?room=' + encodeURIComponent(currentRoom) + '&username=' + encodeURIComponent(currentUser))
        .then(r => r.json())
        .then(data => { if (data.ok) updateWxBindUI(data.bound); })
        .catch(() => {});
    }

    function updateWxBindUI(bound) {
      wxBound = bound;
      const dot = document.getElementById('wx-status-dot');
      const text = document.getElementById('wx-status-text');
      const btn = document.getElementById('wx-bind-btn');
      if (bound) {
        dot.className = 'wx-status-dot bound';
        text.textContent = '已绑定';
        btn.textContent = '解绑';
        btn.className = 'btn-wx unbind';
      } else {
        dot.className = 'wx-status-dot unbound';
        text.textContent = '未绑定';
        btn.textContent = '绑定微信';
        btn.className = 'btn-wx bind';
      }
    }

    function handleWxBind() {
      if (wxBound) {
        // 解绑
        fetch('/api/wx/unbind', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room: currentRoom, username: currentUser })
        }).then(r => r.json()).then(data => {
          if (data.ok) {
            updateWxBindUI(false);
            showToast('💬', '已解绑微信通知');
          }
        });
      } else {
        // 显示二维码
        showWxQrCode();
      }
    }

    function showWxQrCode() {
      const overlay = document.createElement('div');
      overlay.className = 'qr-overlay';
      overlay.innerHTML =
        '<div class="qr-card">' +
          '<div class="qr-title">绑定微信通知</div>' +
          '<div class="qr-desc">微信扫描下方二维码关注<br>之后收到心情会推送到微信</div>' +
          '<div class="qr-loading" id="qr-loading">加载中...</div>' +
          '<button class="btn-dismiss" onclick="this.closest(\'.qr-overlay\').remove()">关闭</button>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      // 请求二维码
      fetch('/api/wx/qrcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: currentRoom, username: currentUser })
      }).then(r => r.json()).then(data => {
        const loading = document.getElementById('qr-loading');
        if (!loading) return;
        if (data.code === 1000 && data.data && data.data.url) {
          const img = document.createElement('img');
          img.src = data.data.url;
          img.alt = '微信扫码关注';
          loading.replaceWith(img);
          // 轮询绑定状态
          const pollInterval = setInterval(() => {
            fetch('/api/wx/status?room=' + encodeURIComponent(currentRoom) + '&username=' + encodeURIComponent(currentUser))
              .then(r => r.json())
              .then(d => {
                if (d.ok && d.bound) {
                  clearInterval(pollInterval);
                  updateWxBindUI(true);
                  const qrOverlay = document.querySelector('.qr-overlay');
                  if (qrOverlay) qrOverlay.remove();
                  showToast('✅', '微信通知绑定成功！');
                }
              }).catch(() => {});
          }, 3000);
          // 5分钟后停止轮询
          setTimeout(() => clearInterval(pollInterval), 5 * 60 * 1000);
        } else {
          loading.textContent = '二维码获取失败，请重试';
        }
      }).catch(() => {
        const loading = document.getElementById('qr-loading');
        if (loading) loading.textContent = '网络错误，请重试';
      });
    }

    function playNotifSound() {
      try {
        const s = document.getElementById('notif-sound');
        s.currentTime = 0;
        s.play().catch(() => {});
      } catch(e) {}
    }

    function addToHistory(from, mood, emoji, message, timestamp, isSent, msgId, photo, target) {
      const time = new Date(timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const msgHtml = message ? '<div class="b-msg">"' + message + '"</div>' : '';
      const photoHtml = photo ? '<img class="b-photo" src="' + photo + '" onclick="showPhotoLightbox(this.src)">' : '';
      const readStatusHtml = isSent ? '<span class="b-read-status unread"><span class="check-icon">✓</span> 未读</span>' : '';
      const recallHtml = isSent ? '<button class="b-recall" onclick="recallMessage(' + msgId + ')">撤回</button>' : '';
      const nameLabel = isSent ? '我 → ' + target : from;

      const bubble = document.createElement('div');
      bubble.className = isSent ? 'bubble sent-bubble' : 'bubble';
      bubble.setAttribute('data-msg-id', msgId);

      bubble.innerHTML =
        '<span class="b-emoji">' + emoji + '</span>' +
        '<div class="b-content">' +
          '<div class="b-header">' +
            '<span class="b-name">' + nameLabel + '</span>' +
            '<span class="b-mood">' + mood + '</span>' +
          '</div>' +
          msgHtml + photoHtml +
          '<div class="b-footer">' +
            '<span class="b-time">' + time + '</span>' +
            readStatusHtml + recallHtml +
          '</div>' +
        '</div>';

      historyList.insertBefore(bubble, historyList.firstChild);

      // 10分钟后隐藏撤回按钮
      if (isSent) {
        setTimeout(() => {
          const recallBtn = bubble.querySelector('.b-recall');
          if (recallBtn) recallBtn.style.display = 'none';
        }, 10 * 60 * 1000);
      }
    }
  </script>
</body>
</html>
